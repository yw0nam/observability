apiVersion: 1

providers:
  - name: 'Agent Observability'
    orgId: 1
    folder: 'Agents'
    folderUid: agents-folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
