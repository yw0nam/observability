global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/prometheus_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    scrape_interval: 15s
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: otel-collector

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: loki

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: grafana
